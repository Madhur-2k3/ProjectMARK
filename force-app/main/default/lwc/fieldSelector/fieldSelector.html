<template>
    <template if:true={selectedObject}>
        <div class="slds-grid slds-p-around_medium slds-grid_align-spread">

            <!-- LEFT BOX -->
            <div class="listbox-container">
                <label>Available Fields</label>
                <select size="12" class="listbox" onchange={handleLeftSelection}>
                    <template for:each={fieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

            <!-- BUTTONS -->
            <div class="button-container">
                <lightning-button label=">" onclick={moveRight}></lightning-button>
                <lightning-button label="<" onclick={moveLeft} class="slds-m-top_small"></lightning-button>
            </div>

            <!-- RIGHT BOX -->
            <div class="listbox-container">
                <label>Selected Fields</label>
                <select size="12" class="listbox" onchange={handleRightSelection}>
                    <template for:each={selectedFieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

        </div>
    </template>

    <template if:false={selectedObject}>
        <p class="slds-p-around_medium">Select an SObject to view fields.</p>
    </template>
    <template if:true={selectedFieldOptions.length}>
        <lightning-combobox
            class="slds-m-around_medium"
            name=""
            label="select"
            value={selectedOption}
            options={selectOptions}
            onchange={handleSecond}></lightning-combobox>
    </template>

    <!-- <lightning-button variant="brand" label="Submit" onclick={handleClick} disabled={disabled} class="slds-m-left_x-small slds-m-around_medium padding-top-1"></lightning-button> -->

    <template if:true={booleanFlag} >
            <template for:each={dumArray} for:item="dum" for:index="index">
                <div key={dum.Id} class="boxes slds-m-around_medium">
                <div class="box">
                    <lightning-combobox
                    name="field"
                    label="field"
                    data-index={index}
                    value={dum.field}
                    options={fieldOptions}
                    onchange={handleFieldChange}
                    ></lightning-combobox>
                </div>
                <div class="box">
                    <lightning-combobox 
                        name="operator"
                        label="operator"
                        data-index={index}
                        value={dum.operator}
                        options={operatorOptions}
                        onchange={handleOptionChange}
                    ></lightning-combobox>
                </div>
                <div class="box">
                    <lightning-input name="value" title="Value" data-index={index} value={dum.value} placeholder="Enter value" onchange={handleInput}></lightning-input>
                </div>
                <div class="logic-operator">
                    <lightning-combobox 
                        name="logicOperator"
                        label="Logic Operator"
                        data-index={index}
                        value={dum.logicOperator}
                        options={logicOperatorOptions}
                        onchange={handleLogicOperatorChange}
                        default-value="AND"
                    ></lightning-combobox>
                </div>
                <div class="bin">
                    <lightning-button-icon icon-name="utility:delete" alternative-text="delete" title="delete"  data-index={index} onclick={handleDelete} class="slds-m-top_medium"></lightning-button-icon>
                </div>
                
                </div>
            </template>
            
            <div class="btn">
                <lightning-button type="submit" class="slds-m-around_medium" label="Add Condition" onclick={handleAddCondition} ></lightning-button>
            </div>
            <lightning-button type="submit" class="slds-m-around_medium" label="get Accounts" onclick={handleFilterAccounts} ></lightning-button>

            <c-dynamic-data-table data={paginatedData} columns={filteredAccountColumns} key-field="Id" class="slds-m-around_medium" ></c-dynamic-data-table>
        </template>
        
</template>
