<template>
    <template if:true={fieldOptions}>
        <lightning-card class="slds-p-around_medium">
            <div class="slds-p-horizontal_medium">
                <lightning-dual-listbox
                    name="fields"
                    label="Select Fields"
                    source-label="Available Fields"
                    selected-label="Selected Fields"
                    field-level-help="Required fields are auto-selected and locked"
                    options={fieldOptions}
                    value={selectedValues}
                    onchange={handleChange}>
                </lightning-dual-listbox>
            </div>
            <div class="checkbox slds-p-around_medium">
                <lightning-input
                    type="checkbox"
                    label="Include all fields"
                    checked={includeAllFields}
                    onchange={handleIncludeAllFieldsChange}>
                </lightning-input>
            </div>
        </lightning-card>
    </template>
</template>
