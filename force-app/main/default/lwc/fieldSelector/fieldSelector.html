<template>
    <template if:true={selectedObject}>

        
        <div class="field-row">

            <!-- LEFT BOX -->
            <div class="listbox-container">
                <label>Available Fields</label>
                <select size="12" class="listbox hide-scrollbar" onchange={handleLeftSelection}>
                    <template for:each={fieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

            <!-- BUTTONS -->
            <div class="button-container">
                <lightning-button label=">" onclick={moveRight}></lightning-button>
                <lightning-button 
                    label="<" 
                    onclick={moveLeft} 
                    class="slds-m-top_small">
                </lightning-button>
            </div>

            <!-- RIGHT BOX -->
            <div class="listbox-container ">
                <label>Selected Fields</label>
                <select size="12" class="listbox hide-scrollbar" onchange={handleRightSelection}>
                    <template for:each={selectedFieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

        </div>
        <!-- END FIELD ROW -->

    </template>

    <template if:false={selectedObject}>
        <p class="slds-p-around_medium">Select an SObject to view fields.</p>
    </template>

    <template if:true={selectedFieldOptions.length}>
        <div class="filter">
            <lightning-combobox
            class="slds-m-around_medium "
            name="filter"
            label="Filter"
            value={selectedOption}
            options={selectOptions}
            onchange={handleSecond}>
        </lightning-combobox>
        </div>
        
    </template>

    <template if:true={booleanFlag}>
        <template for:each={dumArray} for:item="dum" for:index="index">
            <div key={dum.Id} class="boxes slds-m-around_medium">
                
                <div class="box">
                    <lightning-combobox
                        name="field"
                        label="field"
                        data-index={index}
                        value={dum.field}
                        options={allFieldsForQuery}
                        onchange={handleFieldChange}>
                    </lightning-combobox>
                </div>

                <div class="box">
                    <lightning-combobox 
                        name="operator"
                        label="operator"
                        data-index={index}
                        value={dum.operator}
                        options={operatorOptions}
                        onchange={handleOptionChange}>
                    </lightning-combobox>
                </div>

                <div class="box">
                    <lightning-input 
                        name="value"
                        label="value"
                        title="Value"
                        data-index={index}
                        value={dum.value}
                        placeholder="Enter value"
                        onchange={handleInput}>
                    </lightning-input>
                </div>

                <div class="logic-operator">
                    <lightning-combobox 
                        name="logicOperator"
                        label="Logic Operator"
                        data-index={index}
                        value={dum.logicOperator}
                        options={logicOperatorOptions}
                        onchange={handleLogicOperatorChange}>
                    </lightning-combobox>
                </div>

                <div class="bin">
                    <lightning-button-icon 
                        icon-name="utility:delete" 
                        alternative-text="delete" 
                        title="delete"
                        data-index={index}
                        onclick={handleDelete}
                        class="slds-m-top_medium">
                    </lightning-button-icon>
                </div>

            </div>
        </template>

        <div class="btn">
            <lightning-button 
                type="submit"
                class="slds-m-around_medium"
                label="Add Condition"
                onclick={handleAddCondition}>
            </lightning-button>
        </div>

        <lightning-button 
            type="submit"
            class="slds-m-around_medium"
            label="Submit"
            onclick={handleFilterAccounts}>
        </lightning-button>

        <template if:true={showDatatable}>
            <!-- <lightning-datatable
                key-field="Id"
                data={paginatedData}
                columns={columns}>
            </lightning-datatable> -->
             <c-dynamic-data-table data={filteredAccounts} columns={dataTableColumns} key-field="Id" class="slds-m-around_medium" ></c-dynamic-data-table>
        </template>
        

    </template>
</template>
