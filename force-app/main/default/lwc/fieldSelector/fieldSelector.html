<template>

    <!-- Show only when object is selected -->
    <template if:true={selectedObject}>

        <!-- FIELD SELECTOR SECTION -->
        <div class="field-row">

            <!-- LEFT BOX -->
            <div class="listbox-container">
                <label>Available Fields</label>
                <select size="12" class="listbox hide-scrollbar" onchange={handleLeftSelection}>
                    <template for:each={fieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

            <!-- BUTTONS -->
            <div class="button-container">
                <lightning-button label=">" onclick={moveRight}></lightning-button>
                <lightning-button 
                    label="<" 
                    onclick={moveLeft} 
                    class="slds-m-top_small">
                </lightning-button>
            </div>

            <!-- RIGHT BOX -->
            <div class="listbox-container">
                <label>Selected Fields</label>
                <select size="12" class="listbox hide-scrollbar" onchange={handleRightSelection}>
                    <template for:each={selectedFieldOptions} for:item="fld">
                        <option key={fld.value} value={fld.value}>{fld.label}</option>
                    </template>
                </select>
            </div>

        </div>

    </template>

    <!-- If no object selected -->
    <template if:false={selectedObject}>
        <p class="slds-p-around_medium">Select an Object to view fields.</p>
    </template>

    <!-- FILTER DROPDOWN -->
    <template if:true={selectedFieldOptions.length}>
        <div class="filter">
            <lightning-combobox
                class="slds-m-around_medium"
                label="Filter"
                value={selectedOption}
                options={selectOptions}
                onchange={handlefilter}>
            </lightning-combobox>
        </div>
    </template>


    <!-- QUERY BUILDER SECTION -->
    <template if:true={queryflag}>

        <template for:each={dumArray} for:item="dum" for:index="index">
            <div key={dum.Id} class="boxes slds-m-around_medium">

                <!-- FIELD -->
                <div class="box">
                    <lightning-combobox
                        name="field"
                        label="field"
                        data-index={index}
                        value={dum.field}
                        options={masterFieldOptions}
                        onchange={handleFieldChange}>
                    </lightning-combobox>
                </div>

                <!-- OPERATOR -->
                <div class="box">
                    <lightning-combobox 
                        name="operator"
                        label="operator"
                        data-index={index}
                        value={dum.operator}
                        options={operatorOptions}
                        onchange={handleOptionChange}>
                    </lightning-combobox>
                </div>

                <!-- VALUE -->
                <div class="box">
                    <lightning-input 
                        name="value"
                        label="value"
                        data-index={index}
                        value={dum.value}
                        placeholder="Enter value"
                        onchange={handleInput}>
                    </lightning-input>
                </div>

                <!-- LOGIC OPERATOR -->
                <div class="logic-operator">
                    <lightning-combobox 
                        name="logicOperator"
                        label="Logic Operator"
                        data-index={index}
                        value={dum.logicOperator}
                        options={logicOperatorOptions}
                        onchange={handleLogicOperatorChange}>
                    </lightning-combobox>
                </div>

                <!-- DELETE -->
                <div class="bin">
                    <lightning-button-icon 
                        icon-name="utility:delete" 
                        alternative-text="delete"
                        data-index={index}
                        onclick={handleDelete}
                        class="slds-m-top_medium">
                    </lightning-button-icon>
                </div>

            </div>
        </template>

        <!-- SUBMIT BUTTON -->
        <lightning-button 
            class="slds-m-around_medium"
            label="Submit"
            onclick={handleFilterAccounts}>
        </lightning-button>

    </template>


    <!-- ALL MODE SUBMIT BUTTON -->
    <template if:true={allflag}>
        <lightning-button 
            class="slds-m-around_medium"
            label="Submit"
            onclick={handleFilterAccounts}>
        </lightning-button>
    </template>


    <!-- DATATABLE + PAGINATION SECTION -->
    <template if:true={showDatatable}>

        <!-- Page Size -->
        <div class="slds-m-around_medium">
            <lightning-combobox
                label="Records Per Page"
                value={pageSize}
                options={pageSizeOptions}
                onchange={handlePageSizeChange}>
            </lightning-combobox>
        </div>

        <!-- DATATABLE -->
        <lightning-datatable 
            key-field="Id"
            data={paginatedData}
            columns={dataTableColumns}
            onrowselection={handleRowSelection}
            selected-rows={_selectedRowsForTable}>
        </lightning-datatable>

        <!-- PAGINATION -->
        <div class="slds-m-around_medium slds-align_absolute-center">
            <div class="slds-pill_container">

                <!-- Previous -->
                <span class="slds-pill slds-p-horizontal_small slds-m-right_small">
                    <lightning-button 
                        variant="base"
                        label="Previous"
                        onclick={handlePrevious}
                        disabled={isPreviousDisabled}>
                    </lightning-button>
                </span>

                <!-- Page Info -->
                <span class="slds-pill slds-theme_info slds-p-horizontal_small slds-m-right_small">
                    Page {currentPage} of {totalPages}
                </span>

                <!-- Next -->
                <span class="slds-pill slds-p-horizontal_small">
                    <lightning-button 
                        variant="base"
                        label="Next"
                        onclick={handleNext}
                        disabled={isNextDisabled}>
                    </lightning-button>
                </span>

            </div>
        </div>

        <!-- ARCHIVE BUTTON -->
        <div class="slds-align_absolute-center">
            <lightning-button 
                label="Archive Selected"
                variant="brand"
                onclick={handleArchive}
                disabled={isArchiveDisabled}>
            </lightning-button>
        </div>

    </template>

</template>
