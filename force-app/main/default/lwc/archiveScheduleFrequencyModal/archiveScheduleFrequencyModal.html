<template>
    <c-generic-modal modal-title="Configure Schedule Frequency"
                     footer-directional onclose={handleClose}>

        <!-- ─── Frequency Selection ─── -->
        <lightning-radio-group label="Choose Frequency" options={frequencyOptions} value={selectedFrequency}
            onchange={handleFrequencyChange}>
        </lightning-radio-group>

        <!-- ─── Preferred Time (visible after frequency selected) ─── -->
        <template if:true={selectedFrequency}>
            <div class="slds-m-top_medium">
                <lightning-input type="time" label="Preferred Execution Time" value={preferredTime}
                    onchange={handleTimeChange}>
                </lightning-input>
                <p class="slds-text-color_weak slds-m-top_xx-small" style="font-size: 11px;">
                    Select when the archive job should run.
                </p>
            </div>
        </template>

        <!-- ─── Day of Week (Weekly only) ─── -->
        <template if:true={showDayOfWeek}>
            <div class="slds-m-top_medium">
                <lightning-combobox label="Day of Week" placeholder="Select a day..." value={selectedDayOfWeek}
                    options={dayOfWeekOptions} onchange={handleDayOfWeekChange}>
                </lightning-combobox>
            </div>
        </template>

        <!-- ─── Summary Preview ─── -->
        <template if:true={selectedFrequency}>
            <div class="schedule-summary slds-m-top_medium slds-box slds-theme_shade">
                <lightning-icon icon-name="utility:date_time" size="x-small"
                    class="slds-m-right_x-small"></lightning-icon>
                <span class="summary-text">{scheduleSummary}</span>
            </div>
        </template>

        <!-- FOOTER -->
        <div slot="footer">
            <lightning-button label="Previous" variant="neutral" icon-name="utility:back" onclick={handlePrevious}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button label="Confirm Schedule" variant="brand" onclick={handleNext} disabled={isDisabled}>
            </lightning-button>
        </div>

    </c-generic-modal>
</template>
