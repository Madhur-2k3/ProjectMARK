<template>
    <div class="header-bar">

        <!-- LEFT → Icon + Title -->
        <div class="header-left">
            <div class="app-logo">DA</div>

            <div class="header-text">
                <h1>Data Archive Console</h1>
                <p>Archival Is Not Deletion-Just Smart Data Management</p>
            </div>
        </div>

        <!-- CENTER → Custom Toggle -->
        <div class="toggle-wrapper">
            <div class="toggle-container">

                <button class={archiveClass}
                        onclick={activateArchive}>
                    <span class="dot"></span>
                    Archive
                </button>

                <button class={unArchiveClass}
                        onclick={activateUnArchive}>
                    <span class="dot"></span>
                    Un-Archive
                </button>

            </div>
        </div>

        <!-- RIGHT → Status Pill -->
        <div class="status-pill-wrapper slds-tooltip-trigger slds-tooltip-trigger_hover">

    <div class="status-pill">
        <span class="green-dot"></span>
        Instructions
    </div>
    <lightning-button
        label="Schedule"
        variant="brand"
        class="slds-m-left_small"
        onclick={openScheduleModal}>
    </lightning-button>

    <div class="slds-tooltip slds-nubbin_top" role="tooltip">
        <div class="slds-tooltip__content">
            <p><b>{instructionTitle}</b></p>

            <ul>
                <template for:each={instructions} for:item="item">
                    <li key={item}>{item}</li>
                </template>
            </ul>
        </div>
    </div>

</div>


    </div>

    <!-- BODY COMPONENTS -->
    <template lwc:if={booleanFlag}>
        <c-s-object-combox></c-s-object-combox>
    </template>

    <template lwc:if={unArchiveFlag}>
        <c-un-archived-data class="header-unArchive"></c-un-archived-data>
    </template>

    <!-- FREQUENCY MODAL -->
<template if:true={showScheduleModal}>
    <c-archive-schedule-frequency-modal
        onfrequencyselected={handleFrequencySelected}
        onclose={closeAllModals}>
    </c-archive-schedule-frequency-modal>
</template>

<!-- CRITERIA MODAL -->
<template if:true={showCriteriaModal}>
    <c-archive-schedule-criteria-modal
        selected-frequency={selectedFrequency}
        oncriteriaselected={handleCriteriaSelected}
        onclose={closeAllModals}>
    </c-archive-schedule-criteria-modal>
</template>

<!-- OBJECT MODAL (REUSING YOUR OBJECT SELECTOR) -->
<template if:true={showObjectModal}>
    <c-archive-schedule-object-modal
        selected-frequency={selectedFrequency}
        selected-criteria={selectedCriteria}
        onschedulecomplete={handleScheduleComplete}
        onclose={closeAllModals}>
    </c-archive-schedule-object-modal>
</template>


</template>
