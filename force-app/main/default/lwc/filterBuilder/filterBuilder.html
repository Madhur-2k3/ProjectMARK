<template>
    <div class="slds-p-horizontal_large conditions-builder-container">
        <template lwc:if={showToggle}>
            <div class="header">
                <lightning-button-group>
                    <lightning-button label="All records" variant={allRecordsVariant} onclick={showAllRecords}>
                    </lightning-button>

                    <lightning-button label="Filter records" variant={filterRecordsVariant} onclick={showFilterRecords}>
                    </lightning-button>
                </lightning-button-group>
            </div>
        </template>
        <template lwc:if={showToggle}>
            <template if:true={showModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
                    class="slds-modal slds-fade-in-open slds-modal_large">
                    <div class="slds-modal__container modal-premium">

                        <!-- Premium Blue Header -->
                        <header class="modal-header-custom">
                            <button class="modal-close-btn" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close"
                                    size="small"></lightning-icon>
                            </button>

                            <div class="modal-header-content">
                                <div class="modal-header-icon">
                                    <lightning-icon icon-name="utility:archive" size="small"></lightning-icon>
                                </div>
                                <div>
                                    <h2 id="modal-heading-01" class="modal-title">Archive Records</h2>
                                    <p class="modal-subtitle">Step {archiveModalStep} of 2</p>
                                </div>
                            </div>

                            <!-- Step Progress -->
                            <div class="step-progress">
                                <div class={step1Class}>
                                    <span class="step-number">1</span>
                                    <span class="step-label">Name</span>
                                </div>
                                <div class="step-line"></div>
                                <div class={step2Class}>
                                    <span class="step-number">2</span>
                                    <span class="step-label">Child Objects</span>
                                </div>
                            </div>
                        </header>

                        <div class="slds-modal__content modal-body-custom">

                            <!-- STEP 1: Archive Name -->
                            <template if:true={isArchiveStep1}>
                                <div class="modal-step-content">
                                    <lightning-input label="Data Archive Record Name" type="text" value={archiveName}
                                        maxlength="80" required placeholder="Enter a name for the archive record"
                                        onchange={handleArchiveNameChange} class="slds-m-bottom_medium">
                                    </lightning-input>

                                    <p class="modal-message">{modalMessage}</p>

                                    <div class="info-callout">
                                        <lightning-icon icon-name="utility:info" size="x-small"
                                            class="info-icon"></lightning-icon>
                                        <p class="info-text"><b>Note:</b> {note}</p>
                                    </div>
                                </div>
                            </template>

                            <!-- STEP 2: Child Object Selection -->
                            <template if:true={isArchiveStep2}>
                                <c-child-object-tree-selector object-name={objectname}
                                    onselectionchange={handleChildSelectionChange}>
                                </c-child-object-tree-selector>
                            </template>

                        </div>

                        <footer class="modal-footer-custom">
                            <lightning-button variant="neutral" label="Cancel" onclick={closeModal}
                                class="modal-btn-cancel"></lightning-button>

                            <template if:true={isArchiveStep1}>
                                <lightning-button variant="brand" label="Next: Select Child Objects"
                                    icon-name="utility:forward" icon-position="right" onclick={handleArchiveModalNext}
                                    disabled={isStartArchiveDisabled} class="modal-btn-primary">
                                </lightning-button>
                            </template>

                            <template if:true={isArchiveStep2}>
                                <lightning-button variant="neutral" label="Back" icon-name="utility:back"
                                    onclick={handleArchiveModalPrevious} class="slds-m-right_x-small">
                                </lightning-button>
                                <lightning-button variant="brand" label="Start Archive" icon-name="utility:archive"
                                    onclick={confirmArchive} class="modal-btn-primary">
                                </lightning-button>
                            </template>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </template>

        <template if:true={showFilters}>
            <div class="conditions-combobox">
                <lightning-combobox label="Condition Requirements" value={selectedCondition} options={conditionOptions}
                    onchange={handleConditionChange}>
                </lightning-combobox>
            </div>
            <template if:true={isCustom}>
                <lightning-textarea label="Custom Condition Logic (e.g. (1 AND 2) OR 3)" onchange={handleCustomLogic}>
                </lightning-textarea>
            </template>

            <div class="filter-container">

                <template for:each={filters} for:item="flt" for:index="index">
                    <div key={flt.id} class="filter-row">
                        <!-- if custom then show Array Indices -->
                        <template if:true={isCustom}>
                            <p class="condition">{flt.displayIndex}</p>
                        </template>

                        <!-- if first show div with class name as filter-box-first else filter-box -->
                        <template if:false={isCustom}>
                            <div class={flt.showJoin}>
                                <p class="condition">{selectedCondition}</p>
                            </div>
                        </template>



                        <div class="box">
                            <lightning-combobox value={flt.field} data-id={flt.id} options={fieldOptions}
                                onchange={handleFieldChange}>
                            </lightning-combobox>
                        </div>


                        <div class="box">
                            <lightning-combobox value={flt.operator} data-id={flt.id} options={flt.operatorOptions}
                                onchange={handleOperatorChange}>
                            </lightning-combobox>
                        </div>


                        <template if:true={flt.isDate}>
                            <div class="box">
                                <lightning-input type="date" value={flt.value} data-id={flt.id}
                                    onchange={handleValueChange}>
                                </lightning-input>
                                <!-- <c-field-validator
                            value={flt.value}
                            type="DATE">
                        </c-field-validator> -->
                            </div>
                        </template>
                        <template if:true={flt.isDateTime}>
                            <div class="box">
                                <lightning-input type="datetime" value={flt.value} data-id={flt.id}
                                    onchange={handleValueChange}>
                                </lightning-input>
                                <!-- <c-field-validator
                            value={flt.value}
                            type="DATE">
                        </c-field-validator> -->
                            </div>
                        </template>

                        <template if:true={flt.showTextInput}>
                            <div class="box">
                                <lightning-input type="text" value={flt.value} data-id={flt.id}
                                    onchange={handleValueChange}>
                                </lightning-input>
                                <c-field-validator value={flt.value} type={flt.fieldType}>
                                </c-field-validator>
                            </div>
                        </template>

                        <div class="btn">
                            <lightning-button-icon icon-name="utility:delete" data-id={flt.id} onclick={removeFilter}>
                            </lightning-button-icon>
                        </div>


                    </div>
                </template>
                <div class="add-filter">
                    <lightning-button label="Add Filter Condition" variant="brand"
                        onclick={addFilter}></lightning-button>
                </div>

            </div>
            <template lwc:if={showToggle}>
                <template if:true={isFilterMode}>
                    <div class="submit-btn">
                        <lightning-button variant="brand" label="Submit" disabled={isSubmitDisabled}
                            onclick={handleFilterAccounts}>
                        </lightning-button>
                    </div>

                </template>
            </template>
        </template>


        <template lwc:if={showToggle}>
            <template if:false={isFilterMode}>
                <div class="submit-btn">
                    <lightning-button class="" label="Get all Records" disabled={isButtonDisabled}
                        onclick={handleFilterAccounts}>
                    </lightning-button>
                </div>

            </template>
        </template>
    </div>
    <template lwc:if={showToggle}>
        <template if:true={showTable}>
            <template if:false={showNoRecords}>
                <div class="conditions-builder-container">


                    <div class="table-header">
                        <p class="table-heading"><b>{objectLabel} Records</b></p>
                        <c-capsule-dropdown value={pageSize} options={pageSizeOptions} onchange={handlePageSizeChange}>
                        </c-capsule-dropdown>
                    </div>
                    <div class="slds-p-horizontal_small slds-p-bottom_small slds-m-top_small">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center">

                            <div class="slds-col slds-grow slds-grid slds-grid_align-center demo">

                                <lightning-button label="Previous" variant="brand" onclick={handlePrevious}
                                    disabled={isPreviousDisabled} class="slds-m-right_small">
                                </lightning-button>

                                <span class="slds-text-body_small slds-m-right_small">
                                    Page {currentPage} Of {totalPages}
                                </span>

                                <lightning-button label="Next" variant="brand" onclick={handleNext}
                                    disabled={isNextDisabled}>
                                </lightning-button>

                            </div>

                            <div class="slds-col slds-text-align_right slds-m-top_small slds-m-top_none">
                                <lightning-button label={archiveButtonLabel} variant="brand" disabled={isButtonDisabled}
                                    onclick={handlearchive}>
                                </lightning-button>
                            </div>

                        </div>
                    </div>

                    <c-dynamic-data-table show-archive-table="true" archivedata={filteredAccounts}
                        archivecolumns={tablecolumnsname} archive-selected-rows={archiveSelectedRows}
                        onarchiverowselection={handleArchiveRowSelections}>
                    </c-dynamic-data-table>

                    <div class="slds-p-horizontal_small slds-p-bottom_small slds-m-top_small">
                        <div class="slds-grid slds-wrap slds-grid_vertical-align-center">

                            <div class="slds-col slds-grow slds-grid slds-grid_align-center demo">

                                <lightning-button label="Previous" variant="brand" onclick={handlePrevious}
                                    disabled={isPreviousDisabled} class="slds-m-right_small">
                                </lightning-button>

                                <span class="slds-text-body_small slds-m-right_small">
                                    Page {currentPage} Of {totalPages}
                                </span>

                                <lightning-button label="Next" variant="brand" onclick={handleNext}
                                    disabled={isNextDisabled}>
                                </lightning-button>

                            </div>

                            <div class="slds-col slds-text-align_right slds-m-top_small slds-m-top_none">
                                <lightning-button label={archiveButtonLabel} variant="brand" disabled={isButtonDisabled}
                                    onclick={handlearchive}>
                                </lightning-button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>



        </template>
        <template if:true={showNoRecords}>
            <div class="slds-p-horizontal_small slds-p-bottom_small slds-m-top_small">
                No Records Found
            </div>
        </template>
    </template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Processing..." size="medium" variant="brand">
        </lightning-spinner>
    </template>

    <!-- <div class="soql-preview">
            <p><strong>WHERE Clause Preview:</strong></p>
            <code>{whereClause}</code>
        </div> -->

    <!-- ═══════════════════════════════════════════════════
         WARNING POPUP — Unselected objects will be deleted
         ═══════════════════════════════════════════════════ -->
    <template if:true={showWarningPopup}>
        <div class="warning-overlay">
            <div class="warning-card">

                <!-- Warning Header -->
                <div class="warning-header">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="medium"
                        class="warning-icon">
                    </lightning-icon>
                    <h2 class="warning-title">Warning: Unselected Objects Will Be Permanently Deleted</h2>
                </div>

                <!-- Warning Body -->
                <div class="warning-body">
                    <p class="warning-note">
                        Only the <strong>selected</strong> child objects will be archived and stored safely.
                        The following <strong>unselected</strong> child objects and their records will be
                        <strong>permanently deleted</strong> and <strong>cannot be recovered</strong>.
                    </p>

                    <!-- Unselected Objects Count Badge -->
                    <div class="warning-count-badge">
                        <lightning-icon icon-name="utility:ban" size="xx-small" class="slds-m-right_xx-small">
                        </lightning-icon>
                        <span>{unselectedCount} child object(s) will NOT be archived</span>
                    </div>

                    <!-- Unselected Objects List -->
                    <div class="warning-list-container">
                        <template for:each={unselectedObjects} for:item="obj">
                            <div key={obj.objectName} class="warning-list-item">
                                <lightning-icon icon-name="utility:delete" size="xx-small"
                                    class="delete-icon slds-m-right_x-small">
                                </lightning-icon>
                                <span class="obj-label">{obj.objectLabel}</span>
                                <span class="obj-api">({obj.objectName})</span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Warning Footer -->
                <div class="warning-footer">
                    <lightning-button label="Go Back" variant="neutral"
                        icon-name="utility:back" onclick={handleWarningCancel}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button label="I Understand, Proceed" variant="destructive"
                        icon-name="utility:check" icon-position="left"
                        onclick={handleWarningConfirm}>
                    </lightning-button>
                </div>

            </div>
        </div>
    </template>

</template>
