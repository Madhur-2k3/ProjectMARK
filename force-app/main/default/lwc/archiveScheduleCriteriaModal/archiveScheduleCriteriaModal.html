<template>
    <c-generic-modal modal-title="Define Schedule Criteria"
                     size="large" footer-directional onclose={handleClose}>

        <!-- Schedule Name Input -->
        <lightning-input label="Data Archive Schedule Name" type="text" value={scheduleName} maxlength="80"
            required placeholder="Enter a name for the schedule" onchange={handleNameChange}
            class="slds-m-bottom_medium">
        </lightning-input>

        <!-- Loading spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <c-filter-builder criteria-only fields={fieldsData} onwherechange={handleWhereClauseChange}>
            </c-filter-builder>
        </template>

        <!-- FOOTER -->
        <div slot="footer">
            <lightning-button label="Previous" variant="neutral" icon-name="utility:back" onclick={handlePrevious}
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button label="Next" variant="brand" onclick={handleNext} disabled={isNextDisabled}>
            </lightning-button>
        </div>

    </c-generic-modal>
</template>
