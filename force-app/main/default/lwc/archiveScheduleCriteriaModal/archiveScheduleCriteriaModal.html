<template>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal__container_large">

            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                </button>
                <h2 class="slds-modal__title">Define Schedule Criteria</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <!-- Loading spinner -->
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <c-filter-builder
                        criteria-only
                        fields={fieldsData}
                        onwherechange={handleWhereClauseChange}>
                    </c-filter-builder>
                </template>

            </div>

            <footer class="slds-modal__footer slds-modal__footer_directional">
                <lightning-button
                    label="Previous"
                    variant="neutral"
                    icon-name="utility:back"
                    onclick={handlePrevious}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
