<template>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal__container_large">

            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                </button>
                <h2 class="slds-modal__title">Define Schedule Criteria</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <!-- Schedule Name Input -->
                <lightning-input label="Data Archive Schedule Name" type="text" value={scheduleName} maxlength="80"
                    required placeholder="Enter a name for the schedule" onchange={handleNameChange}
                    class="slds-m-bottom_medium">
                </lightning-input>

                <!-- ─── Criteria Mode Toggle ─── -->
                <div class="criteria-mode-toggle slds-m-bottom_medium">
                    <lightning-radio-group
                        label="Filter Mode"
                        options={criteriaModeOptions}
                        value={criteriaMode}
                        onchange={handleModeChange}
                        type="button">
                    </lightning-radio-group>
                </div>

                <!-- Loading spinner -->
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>

                    <!-- ─── DAYS-BASED FILTER MODE ─── -->
                    <template if:true={isDaysMode}>
                        <div class="days-filter-section">

                            <div class="slds-text-body_regular slds-m-bottom_small days-description">
                                <lightning-icon icon-name="utility:info" size="xx-small"
                                    class="slds-m-right_xx-small"></lightning-icon>
                                Archive records where the selected date field is older than the specified number of days.
                            </div>

                            <div class="days-inputs-row">
                                <!-- Date Field Combobox -->
                                <div class="days-input-field">
                                    <lightning-combobox
                                        label="Date Field"
                                        placeholder="Select a date field..."
                                        options={dateFieldOptions}
                                        value={selectedDateField}
                                        onchange={handleDateFieldChange}
                                        required>
                                    </lightning-combobox>
                                </div>

                                <!-- Days Input -->
                                <div class="days-input-number">
                                    <lightning-input
                                        type="number"
                                        label="Older Than (Days)"
                                        placeholder="e.g. 90"
                                        value={daysValue}
                                        min="1"
                                        onchange={handleDaysChange}
                                        required>
                                    </lightning-input>
                                </div>
                            </div>

                            <!-- Summary Preview -->
                            <template if:true={hasDaysSummary}>
                                <div class="days-summary slds-m-top_medium slds-box slds-theme_shade">
                                    <lightning-icon icon-name="utility:filterList" size="x-small"
                                        class="slds-m-right_x-small"></lightning-icon>
                                    <span class="summary-text">{daysSummary}</span>
                                </div>
                            </template>

                        </div>
                    </template>

                    <!-- ─── ADVANCED FILTER MODE ─── -->
                    <template if:true={isAdvancedMode}>
                        <c-filter-builder criteria-only fields={fieldsData} onwherechange={handleWhereClauseChange}>
                        </c-filter-builder>
                    </template>

                </template>

            </div>

            <footer class="slds-modal__footer slds-modal__footer_directional">
                <lightning-button label="Previous" variant="neutral" icon-name="utility:back" onclick={handlePrevious}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button label="Next" variant="brand" onclick={handleNext} disabled={isNextDisabled}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
