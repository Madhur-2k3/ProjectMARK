<template>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container slds-modal__container_large">

            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                </button>
                <h2 class="slds-modal__title">Define Schedule Criteria</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <!-- Loading spinner -->
                <template if:true={isLoading}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <div class="conditions-builder-container">

                        <!-- Condition Requirements -->
                        <lightning-combobox
                            label="Condition Requirements"
                            value={selectedCondition}
                            options={conditionOptions}
                            onchange={handleConditionChange}
                            class="slds-m-bottom_small">
                        </lightning-combobox>

                        <!-- Custom Logic Textarea -->
                        <template if:true={isCustom}>
                            <lightning-textarea
                                label="Custom Condition Logic (e.g. (1 AND 2) OR 3)"
                                onchange={handleCustomLogic}
                                class="slds-m-bottom_small">
                            </lightning-textarea>
                        </template>

                        <!-- Filter Rows -->
                        <div class="filter-container">
                            <template for:each={filters} for:item="flt" for:index="index">
                                <div key={flt.id} class="filter-row">

                                    <!-- Custom: show index number -->
                                    <template if:true={isCustom}>
                                        <p class="condition">{flt.displayIndex}</p>
                                    </template>

                                    <!-- AND / OR join label -->
                                    <template if:false={isCustom}>
                                        <div class={flt.showJoin}>
                                            <p class="condition">{selectedCondition}</p>
                                        </div>
                                    </template>

                                    <!-- Field selector -->
                                    <div class="box">
                                        <lightning-combobox
                                            label="Field"
                                            value={flt.field}
                                            data-id={flt.id}
                                            options={fieldOptions}
                                            placeholder="Select field..."
                                            onchange={handleFieldChange}>
                                        </lightning-combobox>
                                    </div>

                                    <!-- Operator selector -->
                                    <div class="box">
                                        <lightning-combobox
                                            label="Operator"
                                            value={flt.operator}
                                            data-id={flt.id}
                                            options={flt.operatorOptions}
                                            onchange={handleOperatorChange}>
                                        </lightning-combobox>
                                    </div>

                                    <!-- Value: Date -->
                                    <template if:true={flt.isDate}>
                                        <div class="box">
                                            <lightning-input
                                                type="date"
                                                label="Value"
                                                value={flt.value}
                                                data-id={flt.id}
                                                onchange={handleValueChange}>
                                            </lightning-input>
                                        </div>
                                    </template>

                                    <!-- Value: DateTime -->
                                    <template if:true={flt.isDateTime}>
                                        <div class="box">
                                            <lightning-input
                                                type="datetime"
                                                label="Value"
                                                value={flt.value}
                                                data-id={flt.id}
                                                onchange={handleValueChange}>
                                            </lightning-input>
                                        </div>
                                    </template>

                                    <!-- Value: Text/Number/etc -->
                                    <template if:true={flt.showTextInput}>
                                        <div class="box">
                                            <lightning-input
                                                type="text"
                                                label="Value"
                                                value={flt.value}
                                                data-id={flt.id}
                                                onchange={handleValueChange}>
                                            </lightning-input>
                                        </div>
                                    </template>

                                    <!-- Delete button -->
                                    <div class="btn">
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            data-id={flt.id}
                                            onclick={removeFilter}>
                                        </lightning-button-icon>
                                    </div>

                                </div>
                            </template>
                        </div>

                        <!-- Add Filter Condition -->
                        <div class="add-filter">
                            <lightning-button
                                label="Add Filter Condition"
                                variant="brand"
                                onclick={addFilter}>
                            </lightning-button>
                        </div>

                        <!-- WHERE Clause Preview -->
                        <template if:true={whereClause}>
                            <div class="where-preview slds-m-top_medium">
                                <p class="slds-text-title_caps slds-m-bottom_xx-small">WHERE Clause Preview</p>
                                <code class="slds-box slds-p-around_x-small">{whereClause}</code>
                            </div>
                        </template>

                    </div>
                </template>

            </div>

            <footer class="slds-modal__footer slds-modal__footer_directional">
                <lightning-button
                    label="Previous"
                    variant="neutral"
                    icon-name="utility:back"
                    onclick={handlePrevious}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    variant="brand"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
