<template>
    <c-generic-modal modal-title="Confirm Archival"
                     header-variant="warning"
                     icon-name="utility:warning"
                     subtitle="Please review the following details carefully before proceeding."
                     onclose={handleCancel}>

        <div slot="header-extra">
            <span class="step-badge">Step 2 of 2</span>
        </div>

        <!-- Warning Banner -->
        <div class="warning-banner">
            <lightning-icon icon-name="utility:error" size="small"
                           variant="error"
                           class="slds-m-right_small"></lightning-icon>
            <div>
                <p class="warning-title">Permanent Deletion Warning</p>
                <p class="warning-text">
                    Records that are <strong>NOT selected</strong> will be
                    <strong>permanently deleted</strong> from Salesforce.
                    This action <strong>cannot be undone</strong>.
                </p>
                <p class="warning-text slds-m-top_x-small">
                    We are <strong>only storing</strong> the selected parent and child records.
                    Unselected records will <strong>not be stored or archived anywhere</strong> &mdash;
                    they will be gone forever.
                </p>
            </div>
        </div>

        <!-- Archive Summary -->
        <div class="summary-section">
            <h3 class="summary-heading">
                <lightning-icon icon-name="utility:check" size="xx-small"
                               class="slds-m-right_xx-small icon-success"></lightning-icon>
                Records to be Archived (Stored)
            </h3>
            <div class="summary-card archive-card">
                <div class="summary-item parent-item">
                    <span class="summary-object">{parentObjectName}</span>
                    <span class="summary-count">{parentRecordCount} record(s)</span>
                </div>
                <template if:true={hasSelectedChildren}>
                    <template for:each={selectedChildSummary} for:item="child">
                        <div key={child.objectName} class="summary-item child-item">
                            <span class="child-connector">└─</span>
                            <span class="summary-object">{child.objectLabel}</span>
                            <span class="summary-count">{child.count} record(s)</span>
                        </div>
                    </template>
                </template>
            </div>
        </div>

        <!-- Deletion Summary -->
        <template if:true={hasUnselectedChildren}>
            <div class="summary-section">
                <h3 class="summary-heading heading-danger">
                    <lightning-icon icon-name="utility:delete" size="xx-small"
                                   class="slds-m-right_xx-small icon-danger"></lightning-icon>
                    Records to be Permanently Deleted (Not Stored)
                </h3>
                <div class="summary-card delete-card">
                    <template for:each={unselectedChildSummary} for:item="child">
                        <div key={child.objectName} class="summary-item delete-item">
                            <lightning-icon icon-name="utility:ban" size="xx-small"
                                           variant="error"
                                           class="slds-m-right_xx-small"></lightning-icon>
                            <span class="summary-object">{child.objectLabel}</span>
                            <span class="summary-count delete-count">{child.count} record(s)</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Type to Confirm -->
        <div class="confirm-input-section">
            <p class="confirm-input-label">
                To proceed, type <strong>CONFIRM</strong> below:
            </p>
            <lightning-input
                type="text"
                placeholder="Type CONFIRM to enable the button"
                value={confirmText}
                onchange={handleConfirmTextChange}
                class="confirm-input">
            </lightning-input>
        </div>

        <!-- FOOTER -->
        <div slot="footer">
            <lightning-button variant="neutral" label="Go Back"
                             onclick={handleCancel}
                             class="slds-m-right_small"></lightning-button>
            <lightning-button variant="destructive" label="Confirm Archive"
                             onclick={handleConfirm}
                             disabled={isConfirmDisabled}
                             icon-name="utility:archive"></lightning-button>
        </div>

    </c-generic-modal>
</template>
