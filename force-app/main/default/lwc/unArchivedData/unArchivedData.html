<template>
    <div class="card">
        <lightning-card>
            <div class="header">
                <h1><b>Un-archive Records</b></h1>

                <c-capsule-dropdown
                    value={pageSize}
                    options={pageSizeOptions}
                    onchange={handlePageSizeChange}>
                </c-capsule-dropdown>
            </div>

            <div class="slds-p-horizontal_small slds-p-top_x-small">
                <c-dynamic-data-table
                    unarchivemode="true"
                    data={archiveRecords}
                    columns={archiveColumns}
                    max-row-selection="1"
                    onrowselection={handleSelection}
                    onrowaction={handleRowAction}>
                </c-dynamic-data-table>
            </div>

            <div class="slds-p-horizontal_small slds-p-bottom_small slds-m-top_small">
                <div class="slds-grid slds-wrap slds-grid_vertical-align-center">

                    <div class="slds-col slds-grow slds-grid slds-grid_align-center demo">
                        <lightning-button
                            label="Previous"
                            onclick={handlePrevious}
                            disabled={isPreviousDisabled}
                            class="slds-m-right_small"
                            variant="brand">
                        </lightning-button>

                        <span class="slds-text-body_small slds-m-right_small">
                            Page {currentPage} of {totalPages}
                        </span>

                        <lightning-button
                            label="Next"
                            onclick={handleNext}
                            disabled={isNextDisabled}
                            variant="brand">
                        </lightning-button>
                    </div>

                    <div class="slds-col slds-text-align_right">
                        <lightning-button
                            label="Un-archive selected"
                            variant="brand"
                            disabled={isButtonDisabled}
                            onclick={handleUnarchive}>
                        </lightning-button>
                    </div>

                </div>
            </div>
        </lightning-card>
    </div>
</template>
