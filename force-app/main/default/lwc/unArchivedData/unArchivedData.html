<template>
    <lightning-card>

       
        <c-dynamic-data-table 
            data={archiveRecords}
            columns={archiveColumns}
            onrowselection={handleSelection}>
        </c-dynamic-data-table>

        
        <div class="slds-m-top_medium slds-m-left_small">
            <lightning-button 
                label="Unarchive"
                variant="brand"
                disabled={isButtonDisabled}
                onclick={handleUnarchive}>
            </lightning-button>
        </div>

    </lightning-card>
</template>
