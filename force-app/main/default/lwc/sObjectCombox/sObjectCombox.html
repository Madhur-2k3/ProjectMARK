<template>
    <div class="object-and-field-container">

        <!-- Card Header -->
        <div class="section-header">
            <div class="section-header-icon">
                <lightning-icon icon-name="utility:search" size="x-small" class="icon-white"></lightning-icon>
            </div>
            <div>
                <h2>Select an Object</h2>
                <p class="section-header-subtitle">Search and pick a Salesforce object to archive</p>
            </div>
        </div>

        <!-- Search -->
        <div class="search-area">
            <lightning-input type="search" label="Search Object" onchange={handleSearch} value={searchTerm}
                placeholder="Start typing to search objects...">
            </lightning-input>
        </div>

        <!-- Object List (only shows when user has typed) -->
        <template if:true={filteredOptions}>
            <ul class="object-list">
                <template for:each={filteredOptions} for:item="opt">
                    <li key={opt.value} value={opt.label} class="object-list-item" data-value={opt.value}
                        data-label={opt.label} onclick={handleSelect}>
                        {opt.label}
                    </li>
                </template>
            </ul>
        </template>

        <!-- Child 1: Field Selector -->
        <template if:true={selectedSObject}>
            <div class="inner-content">
                <c-field-selector selected-object={selectedSObject} onfieldchange={handleFieldChange}>
                </c-field-selector>
            </div>
        </template>

    </div>

    <!-- Child 2: Filter Builder (hidden when hide-filter is set) -->
    <template lwc:if={showFilter}>
        <template if:true={finalFieldsForApex.length}>
            <c-filter-builder tablecolumnsname={datatablecolumns} selectfields={finalFieldsForApex}
                fields={allFieldsForFilter} onwherechange={handleWhereClauseChange} selectobject={selectedSObject}
                query={finalQuery} conditions={whereClause} objectname={selectedSObject} objectlabel={objectLabel}
                changed={changed}>
            </c-filter-builder>
        </template>
    </template>

</template>
