<template>

    <!-- ********** UNARCHIVE DATATABLE (UNCHANGED) ********** -->
    <template if:true={unarchivemode}>
        <lightning-datatable
            key-field={keyField}
            data={data}
            columns={columns}
            max-row-selection={maxRowSelection}
            selected-rows={selectedRows}
            onrowselection={handleRowSelection}
            onrowaction={handleRowAction}>
        </lightning-datatable>
    </template>

    <!-- ********** ARCHIVE DATATABLE (NO MAX SELECTION) ********** -->
<template if:true={showArchiveTable}>
        <lightning-datatable
            key-field={keyField}
            data={archivedata}
            columns={archivecolumns}
            selected-rows={archiveSelectedRows}
            onrowselection={handleArchiveSelection}>
        </lightning-datatable>
    </template>
</template>
