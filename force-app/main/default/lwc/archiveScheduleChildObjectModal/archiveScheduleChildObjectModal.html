<template>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">

                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small">
                    </lightning-icon>
                </button>

                <h2 class="slds-modal__title">
                    Select Child Objects to Archive
                </h2>
                <p class="slds-text-color_weak slds-m-top_xx-small" style="font-size: 12px;">
                    Choose which related child objects should be included when this scheduled archive runs.
                </p>

            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <c-child-object-tree-selector
                    object-name={selectedObject}
                    onselectionchange={handleSelectionChange}>
                </c-child-object-tree-selector>

            </div>

            <footer class="slds-modal__footer slds-modal__footer_directional">
                <lightning-button label="Previous" variant="neutral" icon-name="utility:back"
                    onclick={handlePrevious} class="slds-m-right_x-small">
                </lightning-button>

                <div>
                    <lightning-button label="Skip (Archive All Children)" variant="neutral"
                        onclick={handleSkip} class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button label="Next" variant="brand" icon-name="utility:forward"
                        icon-position="right" onclick={handleNext}>
                    </lightning-button>
                </div>
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

    <!-- ═══════════════════════════════════════════════════
         WARNING POPUP — Unselected objects will be deleted
         ═══════════════════════════════════════════════════ -->
    <template if:true={showWarningPopup}>
        <div class="warning-overlay">
            <div class="warning-card">

                <!-- Warning Header -->
                <div class="warning-header">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="medium"
                        class="warning-icon">
                    </lightning-icon>
                    <h2 class="warning-title">Warning: Unselected objects will be permanently deleted</h2>
                </div>

                <!-- Warning Body -->
                <div class="warning-body">
                    <p class="warning-note">
                        Only the <strong>selected</strong> child objects will be archived and stored safely.
                        The following <strong>unselected</strong> child objects and their records will be
                        <strong> permanently deleted</strong> and <strong>cannot be recovered</strong>.
                    </p>

                    <!-- Unselected Objects Count Badge -->
                    <div class="warning-count-badge">
                        <lightning-icon icon-name="utility:ban" size="xx-small" class="slds-m-right_xx-small">
                        </lightning-icon>
                        <span>{unselectedCount} child object(s) will NOT be archived</span>
                    </div>

                    <!-- Unselected Objects List -->
                    <div class="warning-list-container">
                        <template for:each={unselectedObjects} for:item="obj">
                            <div key={obj.objectName} class="warning-list-item">
                                <lightning-icon icon-name="utility:delete" size="xx-small"
                                    class="delete-icon slds-m-right_x-small">
                                </lightning-icon>
                                <span class="obj-label">{obj.objectLabel}</span>
                                <span class="obj-api">({obj.objectName})</span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Warning Footer -->
                <div class="warning-footer">
                    <lightning-button label="Go Back" variant="neutral"
                        icon-name="utility:back" onclick={handleWarningCancel}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button label="I Understand, Proceed" variant="destructive"
                        icon-name="utility:check" icon-position="left"
                        onclick={handleWarningConfirm}>
                    </lightning-button>
                </div>

            </div>
        </div>
    </template>

</template>
