<template>
    <section class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">

            <header class="slds-modal__header">

                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small">
                    </lightning-icon>
                </button>

                <h2 class="slds-modal__title slds-hyphenate">
                    Select Object For Scheduled Archive
                </h2>

            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <!-- ─── VIEW ALL SCHEDULES BUTTON (right-aligned, above object selector) ─── -->
                <div class="view-schedules-btn-row slds-m-bottom_small">
                    <lightning-button label={allSchedulesToggleLabel} variant="neutral" icon-name="utility:date_time"
                        onclick={toggleAllSchedulesPanel}>
                    </lightning-button>
                </div>

                <!-- ─── ALL SCHEDULES TABLE (collapsible, above object selector) ─── -->
                <template if:true={showAllSchedulesPanel}>
                    <div class="schedules-panel slds-m-bottom_medium">
                        <div class="panel-header">
                            <lightning-icon icon-name="utility:event" size="x-small"
                                class="slds-m-right_x-small"></lightning-icon>
                            <span class="panel-title">All Active Schedules</span>
                            <lightning-badge label={allSchedulesCount} class="slds-m-left_x-small"></lightning-badge>
                        </div>

                        <template if:true={hasAllSchedules}>
                            <div class="schedule-table-wrapper">
                                <lightning-datatable key-field="id" data={allSchedules} columns={allScheduleColumns}
                                    hide-checkbox-column>
                                </lightning-datatable>
                            </div>

                            <!-- Pagination Controls -->
                            <div class="pagination-controls slds-m-top_x-small">
                                <lightning-button label="Previous" icon-name="utility:chevronleft"
                                    onclick={handleAllPreviousPage} disabled={isAllPreviousDisabled} variant="neutral"
                                    class="slds-m-right_x-small">
                                </lightning-button>
                                <span class="page-info">{allPageInfo}</span>
                                <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                                    onclick={handleAllNextPage} disabled={isAllNextDisabled} variant="neutral"
                                    class="slds-m-left_x-small">
                                </lightning-button>
                            </div>
                        </template>

                        <template if:false={hasAllSchedules}>
                            <div class="empty-state slds-text-align_center slds-p-around_medium">
                                <lightning-icon icon-name="utility:info" size="small"
                                    class="slds-m-bottom_x-small"></lightning-icon>
                                <p class="slds-text-color_weak">No objects are currently scheduled.</p>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- ─── OBJECT SELECTOR ─── -->
                <c-s-object-combox hide-filter onobjectselected={handleObjectSelected}>
                </c-s-object-combox>

                <!-- ─── OBJECT-SPECIFIC SCHEDULE WARNING + TABLE ─── -->
                <template if:true={hasExistingSchedule}>
                    <div class="object-schedule-alert slds-m-top_medium">
                        <div class="alert-header">
                            <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"
                                class="slds-m-right_x-small"></lightning-icon>
                            <span class="alert-title">This object has existing schedules ({objectScheduleCount})</span>
                            <lightning-button label={objectScheduleToggleLabel} variant="base"
                                icon-name="utility:chevrondown" class="slds-m-left_small"
                                onclick={toggleObjectScheduleTable}>
                            </lightning-button>
                        </div>

                        <!-- Object-specific schedules TABLE (expandable) -->
                        <template if:true={showObjectScheduleTable}>
                            <div class="schedule-table-wrapper slds-m-top_small">
                                <lightning-datatable key-field="id" data={objectSchedules}
                                    columns={objectScheduleColumns} hide-checkbox-column>
                                </lightning-datatable>
                            </div>

                            <!-- Object-schedules Pagination -->
                            <div class="pagination-controls slds-m-top_x-small">
                                <lightning-button label="Previous" icon-name="utility:chevronleft"
                                    onclick={handleObjPreviousPage} disabled={isObjPreviousDisabled} variant="neutral"
                                    class="slds-m-right_x-small">
                                </lightning-button>
                                <span class="page-info">{objPageInfo}</span>
                                <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right"
                                    onclick={handleObjNextPage} disabled={isObjNextDisabled} variant="neutral"
                                    class="slds-m-left_x-small">
                                </lightning-button>
                            </div>
                        </template>

                        <p class="slds-text-color_weak slds-m-top_x-small" style="font-size: 12px;">
                            You can still create a new schedule with different criteria.
                        </p>
                    </div>
                </template>

            </div>

            <footer class="slds-modal__footer">
                <template if:true={hasExistingSchedule}>
                    <lightning-button label="Create New Schedule" variant="brand" icon-name="utility:add"
                        onclick={handleConfirm} disabled={isDisabled} class="slds-m-right_x-small">
                    </lightning-button>
                </template>
                <template if:false={hasExistingSchedule}>
                    <lightning-button label="Next" variant="brand" onclick={handleConfirm} disabled={isDisabled}>
                    </lightning-button>
                </template>
            </footer>

        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
